bind_US_standard "F12" "exec autoexec"

bind_US_standard "mouse4" "+offhand1;" 0
bind_US_standard "mouse5" "+offhand4;" 0
bind_US_standard "mwheelup" "+forward;" 0
bind_US_standard "mwheeldown" "+jump;" 0

// SHIFT WALK: Allows you to hold shift to walk while auto-sprint is turned on.
// NOTE: "+variableScopeToggle" is added so you can still adjust your zoom while in ADS.
//bind_US_standard "LSHIFT" "+walk; +variableScopeToggle" 0
//player_setting_autosprint "1"

// HEALING: Tapping the selected key will prioritize the cell/syringe.
// Holding the selected key will prioritize the battery/med kit.
bind_US_standard "q" "use_consumable SHIELD_LARGE; use_consumable SHIELD_SMALL"
bind_held_US_standard "q" "use_consumable SHIELD_SMALL; use_consumable SHIELD_LARGE"
bind_US_standard "z" "use_consumable HEALTH_LARGE; use_consumable HEALTH_SMALL"
bind_held_US_standard "z" "use_consumable HEALTH_SMALL; use_consumable HEALTH_LARGE"
bind_US_standard "5" "use_consumable PHOENIX_KIT"